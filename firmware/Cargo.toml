[package]
name = "c92_firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m-rt = "0.7.3"
defmt = "1.0.1"
defmt-rtt = "1.1.0"
mm-decoder = "0.3.1"
lenz-decoder = "0.1.1"

[dependencies.cortex-m]
version = "0.7.7"
features = ["critical-section-single-core"]

[dependencies.stm32g0xx-hal]
version = "0.2.0"
features = ["rt", "stm32g031"]

[dependencies.panic-probe]
version = "1.0.0"
features = ["print-defmt"]

[profile.dev]
opt-level = "s"
debug = "full"
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1

[profile.release]
opt-level = "s"
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1